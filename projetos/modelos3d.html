<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Modelos 3D</title>

    <link rel="stylesheet"
        href="../css-telaVetorial/main.css">

    <link rel="stylesheet"
        href="../css-telaInicial/reset.css">

    <link rel="stylesheet"
        href="../css-telaInicial/footer.css">

    <link rel="stylesheet"
        href="../css-header/header.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poiret+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <script
        src="https://kit.fontawesome.com/493256260c.js"
        crossorigin="anonymous"
        defer></script>
    <link rel="icon" type="image/png"
        href="../img/icones/icone.png">

</head>

<body>
    <header>
        <h1>Modelos 3D</h1>
        <nav>
            <a href="../index.html"><i
                    class="fa-solid fa-circle-xmark"></i></a>
        </nav>
    </header>

    <main>
        <section>
            <div class="grid-container">
                <div class="grid">
                    <figure>
                        <video
                            class="video"
                            class="pagina_Front"
                            width="480"
                            height="270"
                            controls>
                            <source
                                src="../img/3d/Nave.mp4"
                                type="video/mp4">
                            <source
                                src="../img/3d/Nave.ogg"
                                type="video/ogg">
                            Your browser
                            does
                            not support the
                            video tag
                        </video>
                        <figcaption>
                            Nave espacial
                        </figcaption>
                    </figure>
                    <figure>
                        <video
                            class="video"
                            class="pagina_Front"
                            width="480"
                            height="270"
                            controls>
                            <source
                                src="../img/3d/Martelo.mp4"
                                type="video/mp4">
                            <source
                                src="../img/3d/Martelo.ogg"
                                type="video/ogg">
                            Your browser
                            does
                            not support the
                            video tag
                            <figcaption>
                                Martelo
                            </figcaption>
                        </video>
                        <figcaption>
                            Mjolnir
                        </figcaption>
                    </figure>
                </div>
            </div>
        </section>
    </main>
</body>
